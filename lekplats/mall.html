/* arbetsytan i u: skärmen utom fältet och dess avstånd */
function arbetsyta() { return { w: skarm.clientWidth / S.skala, h: skarm.clientHeight / S.skala - (S.lage === "idag" ? 40 : S.falt === "dockat" ? 56 : 72) }; }

function maxa(f) { f.max = !f.max; placera(f); }

  f.el.remove(); FONSTER = FONSTER.filter((x) => x !== f);
  if (AKTIV === f) { AKTIV = null; nastaFonster(); }

}
function dra(e, f) {
  if (e.target.closest("button") || f.max || e.button !== 0) return;
  const sx = e.clientX, sy = e.clientY, ox = f.x, oy = f.y, k = skalaPx();

}

const MAPPAR = { Hem: [["mapp", "Dokument"], ["mapp", "Bilder"], ["mapp", "Musik"], ["mapp", "Projekt"], ["mapp", "Hämtade filer"], ["fil", "anteckningar.md"], ["fil", "budget.ods"], ["fil", "dyner.png"]],

  const k = ["cell", "mer", DOLDA.some((a) => FONSTER.some((f) => f.app === a)) ? "kor" : "", DOLDA.some((a) => UPPMARKSAMHET.has(a)) ? "uppmarksamhet" : ""].join(" ");

function placeraOver(el, ankare) {

/* ---------- paneler ---------- */
const PANELER = { start: ["#start", "#startknapp"], snabb: ["#snabb", "#bricka"], avis: ["#avis", "#klockknapp"] };
let OPPEN = null;
/*
 * Fokusets livscykel. När en panel, en meny eller låsskärmen öppnas sparas
 * var fokus var. Escape, eller samma knapp igen, stänger och lämnar
 * tillbaka fokus dit. Väljs något i panelen får det som öppnas fokus i
 * stället. Ett fönster som aktiveras får fokus där det var senast.
 */
let FORE = null;
function minns() {
  const a = document.activeElement;
  if (a && a !== document.body && !a.closest(".panel, .meny, .overlagg")) FORE = a;
}
function aterstall() {
  const f = FORE; FORE = null;
  if (f && document.contains(f) && !f.closest(".minimerat") && f.getClientRects().length) f.focus({ preventScroll: true });
  else if (AKTIV) fokusera(AKTIV);
  else { const i = $(".ikon"); i && i.focus({ preventScroll: true }); }
}
function vaxla(namn) {
  const varOppen = OPPEN === namn;
  if (OPPEN === null && !FORE) minns();
  stangPaneler();
  if (varOppen) { aterstall(); return; }
  OPPEN = namn; const [p, k] = PANELER[namn]; $("#toast").classList.add("dold");
  $(p).classList.remove("dold"); $(k).classList.add("oppen-panel"); $(k).setAttribute("aria-expanded", "true");
  if (namn === "start") ritaStart();
  if (namn === "avis") { ritaAvis(); $("#prick").hidden = true; }
  const forst = namn === "start" ? $("#sokfalt") : $(p).querySelector("button");
  if (forst) forst.focus({ preventScroll: true });  /* direkt, så att inga tecken går förlorade */
}
function stangPaneler() {
  Object.entries(PANELER).forEach(([, [p, k]]) => { $(p).classList.add("dold"); $(k).classList.remove("oppen-panel"); $(k).setAttribute("aria-expanded", "false"); });
  OPPEN = null; stangMenyer(); $("#sokfalt").value = ""; ALLA = false;
}
let MENY_ANKARE = null;
function oppnaMeny(m, ankare) {
  MENY_ANKARE = ankare; m.hidden = false; placeraOver(m, ankare);
  const b = m.querySelector("button"); b && b.focus({ preventScroll: true });
}
function stangMenyer(tillbaka) {
  const oppen = $$(".meny").some((m) => !m.hidden);
  $$(".meny").forEach((m) => { m.hidden = true; });
  $$('.meny [aria-expanded="true"]').forEach((b) => b.setAttribute("aria-expanded", "false"));
  $("#idagstart").classList.remove("oppen-panel"); $("#idagstart").setAttribute("aria-expanded", "false");

  MENY_ANKARE = null;
}

});

}, true);
let superEnsam = false;
document.addEventListener("keydown", (e) => {
  superEnsam = e.key === "Meta" || e.key === "OS";
  /* Ctrl+Esc öppnar Start, som i NT; Super ensam gör samma sak där webbläsaren släpper igenom den */
  if (e.key === "Escape" && e.ctrlKey) { e.preventDefault(); oppnaStart(); return; }
  if (e.key === "Escape") {
    if (!$("#idagunder").hidden) { const p = $('#idagmeny [aria-expanded="true"]'); stangUnder(); p && p.focus(); }
    else if ($$(".meny").some((x) => !x.hidden)) stangMenyer(true);

    return;
  }
  const m = e.target.closest && e.target.closest(".meny");
  if (m && e.key === "ArrowRight" && e.target.dataset.under) { e.preventDefault(); underMeny(e.target); const x = $("#idagunder button:not([aria-disabled])"); x && x.focus(); return; }
  if (m && m.id === "idagunder" && e.key === "ArrowLeft") { e.preventDefault(); const p = $('#idagmeny [aria-expanded="true"]'); stangUnder(); p && p.focus(); return; }
  if (m && ["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) {
    e.preventDefault();
    const b = [...m.querySelectorAll("button:not([aria-disabled])")], i = b.indexOf(e.target);
    const n = e.key === "Home" ? 0 : e.key === "End" ? b.length - 1 : (i + (e.key === "ArrowDown" ? 1 : -1) + b.length) % b.length;
    b[n].focus();
  }
});

/* Start i dag: en meny med accentbanderoll, som examples/shell/startmenu.c */

function underMeny(b) {

/* Start */
let ALLA = false;
function ritaStart() {
  const q = $("#sokfalt").value.trim().toLowerCase(), box = $("#startinnehall");
  if (q) {
    const appar = Object.keys(APPAR).filter((a) => APPAR[a].namn.toLowerCase().includes(q) || a.includes(q));
    const dok = SENASTE.filter(([, n]) => n.toLowerCase().includes(q));
    const inst = INSTALLNINGAR.filter(([n]) => n.toLowerCase().includes(q));
    const rader = [...appar.map((a) => ({ a, n: APPAR[a].namn, u: "Program", g: () => oppna(a) })),
      ...dok.map(([a, n, t]) => ({ a, n, u: `Dokument · ${t}`, g: () => oppnaDok(n) })),
      ...inst.map(([n, d]) => ({ a: "installningar", n, u: `Inställningar > ${d}`, g: () => oppna("installningar") }))];
    box.innerHTML = rader.length ? `<div class="rubrik">Träffar</div><div class="alla">${rader.map((r, i) =>
      `<button class="rad${i === 0 ? " forst" : ""}" data-i="${i}">${svgA(r.a)}<span><b>${esc(r.n)}</b><small>${esc(r.u)}</small></span></button>`).join("")}</div>`

    box.querySelectorAll(".rad").forEach((b) => b.onclick = () => { rader[b.dataset.i].g(); stangPaneler(); });
    box._forst = rader[0];
    return;

  box._forst = null;
  if (ALLA) {
    const sort = Object.keys(APPAR).sort((a, b) => APPAR[a].namn.localeCompare(APPAR[b].namn, "sv"));
    let bok = "", h = "";
    sort.forEach((a) => { const f = APPAR[a].namn[0].toUpperCase(); if (f !== bok) { bok = f; h += `<div class="bokstav">${f}</div>`; }
      h += `<button class="rad" data-app="${a}">${svgA(a)}<span><b>${esc(APPAR[a].namn)}</b></span></button>`; });
    box.innerHTML = `<div class="rubrik">Alla program<button class="liten-knapp" id="tillbaka">${svgG("chevron-vanster")}Tillbaka</button></div><div class="alla">${h}</div>`;

  /* mörkt tema på: tillbaka till det mörka tema man hade, annars Glöd */
  if (r[0] === "tema") { if (S.tema !== "gryning") MORKT = S.tema; satt("tema", S.tema === "gryning" ? MORKT : "gryning"); return; }
  r[3] = !r[3]; if (r[0] === "mane") skarm.style.filter = r[3] ? "sepia(.35) saturate(1.2)" : ""; ritaRutor();
});
function reglage(inp) { inp.style.setProperty("--v", ((inp.value - inp.min) / (inp.max - inp.min) * 100) + "%"); }
$$('input[type=range]').forEach((i) => { reglage(i); i.addEventListener("input", () => reglage(i)); });
$("#ljus").addEventListener("input", (e) => { $("#dimma").style.opacity = String((100 - e.target.value) / 100 * .7); });

/* aviseringar */
let AVIS = [];
function ritaAvis() {
  $("#avislista").innerHTML = AVIS.length ? AVIS.map((a, i) => `<div class="avisering">${avisHtml(a)}</div>`).join("") : `<p class="tomt">Inga nya aviseringar.</p>`;
  kopplaAvis($("#avislista"));
}
const avisHtml = (a) => `<div class="app">${svgA(a.app)}<span>${esc(APPAR[a.app].namn)}</span>${esc(a.nar)}</div><b>${esc(a.titel)}</b><p>${esc(a.text)}</p>
  <div class="knappar"><button class="knapp primar" data-avis="oppna">${esc(a.knapp)}</button><button class="knapp" data-avis="senare">Påminn senare</button></div>`;
function kopplaAvis(r) {
  r.querySelectorAll("[data-avis]").forEach((b) => b.onclick = () => {
    if (b.dataset.avis === "oppna") oppna("kalender");
    AVIS = []; $("#prick").hidden = true; $("#toast").classList.add("dold"); stangPaneler();
  });
}
$("#rensa").onclick = () => { AVIS = []; ritaAvis(); };
setTimeout(() => {
  const a = { app: "kalender", nar: "nu", titel: "Temagenomgång om 10 min", text: "Videosamtal · 15:00–15:30", knapp: "Öppna" };
  AVIS.push(a); $("#prick").hidden = false; UPPMARKSAMHET.add("kalender"); ritaFalt();
  const t = $("#toast"); t.innerHTML = `<div class="avisering">${avisHtml(a)}</div>`; kopplaAvis(t);
  t.classList.remove("dold"); setTimeout(() => t.classList.add("dold"), 7000);
}, 2500);

/* skrivbordet */
const IKONER = [["mapp-stor", "Hem", () => oppna("filer", { dok: "Hem", nytt: true, titel: "Filer — Hem" })],
  ["mapp-stor", "Projekt", () => oppna("filer", { dok: "Projekt", nytt: true, titel: "Filer — Projekt" })],
  ["fil-stor", "anteckningar.md", () => oppnaDok("anteckningar.md")],
  ["a-terminal", "Terminal", () => oppna("terminal")], ["a-installningar", "Inställningar", () => oppna("installningar")]];
$("#ikoner").innerHTML = IKONER.map(([s, n], i) => `<button class="ikon" role="option" aria-selected="false" data-i="${i}"><svg aria-hidden="true"><use href="#${s}"/></svg><span>${esc(n)}</span></button>`).join("");
$("#ikoner").addEventListener("click", (e) => { const b = e.target.closest(".ikon"); $$(".ikon").forEach((x) => { x.classList.toggle("vald", x === b); x.setAttribute("aria-selected", String(x === b)); }); });
$("#ikoner").addEventListener("dblclick", (e) => { const b = e.target.closest(".ikon"); if (b) IKONER[b.dataset.i][2](); });
$("#ikoner").addEventListener("keydown", (e) => { const b = e.target.closest(".ikon"); if (b && e.key === "Enter") IKONER[b.dataset.i][2](); });
skarm.addEventListener("pointerdown", (e) => { if (e.target === skarm || e.target.id === "ikoner") $$(".ikon").forEach((x) => { x.classList.remove("vald"); x.setAttribute("aria-selected", "false"); }); });

tillampa(); ritaFalt();
setTimeout(() => oppna("text", { dok: "anteckningar.md", titel: "Lekplatsen — Anteckningar" }), 300);
</script>
